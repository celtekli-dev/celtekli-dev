<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="800" height="40" role="img" aria-labelledby="d-t d-d">
<title id="d-t">Section divider</title>
<desc id="d-d">Hexagon divider in Cinderhash orange with packets travelling outward.</desc>
<style>
text{font-kerning:normal}
.sans{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'Geist Mono', SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.fx{transform-box:fill-box;transform-origin:center}
.pk,.ring,.cur,.cover{opacity:0}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes breathe{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes ring{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.85)}}
@keyframes packet{0%{stroke-dashoffset:5}55%,100%{stroke-dashoffset:-100}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{to{transform:translate(48.5px,84px)}}
@keyframes cursor{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){
.enter{animation:enter .7s cubic-bezier(.16,1,.3,1) both}
.float{animation:float 11s ease-in-out infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.drift{animation:drift 36s linear infinite}
.pk{opacity:1;animation:packet 3s linear infinite}
.ring{animation:ring 3.2s ease-out infinite}
@keyframes pop{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.pop{animation:pop 4.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 24s linear infinite}
}
</style>
<defs>
<linearGradient id="d-l" x1="24" x2="384" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a1a" stop-opacity="0"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
<linearGradient id="d-r" x1="416" x2="776" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
<linearGradient id="d-e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
</defs>
<path d="M24 20H384" stroke="url(#d-l)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<path d="M416 20H776" stroke="url(#d-r)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<path class="pk" pathLength="100" d="M385 20H24" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 200" style="animation-duration:3.6s"/>
<path class="pk" pathLength="100" d="M415 20H776" stroke="#ffb347" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 200" style="animation-duration:3.6s"/>
<path class="fx pop" style="animation-delay:0s" d="M110 16.5L113.03 18.25L113.03 21.75L110 23.5L106.97 21.75L106.97 18.25Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/><path class="fx pop" style="animation-delay:0.4s" d="M200 15L204.33 17.5L204.33 22.5L200 25L195.67 22.5L195.67 17.5Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/><path class="fx pop" style="animation-delay:0.8s" d="M290 16.5L293.03 18.25L293.03 21.75L290 23.5L286.97 21.75L286.97 18.25Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/><path class="fx pop" style="animation-delay:1.2s" d="M510 16.5L513.03 18.25L513.03 21.75L510 23.5L506.97 21.75L506.97 18.25Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/><path class="fx pop" style="animation-delay:1.6s" d="M600 15L604.33 17.5L604.33 22.5L600 25L595.67 22.5L595.67 17.5Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/><path class="fx pop" style="animation-delay:2s" d="M690 16.5L693.03 18.25L693.03 21.75L690 23.5L686.97 21.75L686.97 18.25Z" fill="#ff6a1a" fill-opacity=".25" stroke="#ff6a1a" stroke-width="1.25"/>
<path class="fx ring" style="animation-duration:3.6s" d="M400 6L412.12 13L412.12 27L400 34L387.88 27L387.88 13Z" fill="none" stroke="#ff6a1a" stroke-width="1.5"/>
<path class="fx spin" d="M400 6L412.12 13L412.12 27L400 34L387.88 27L387.88 13Z" fill="#ff6a1a" fill-opacity=".14" stroke="url(#d-e)" stroke-width="2"/>
<path d="M400 14L405.2 17L405.2 23L400 26L394.8 23L394.8 17Z" fill="url(#d-e)"/>
</svg>
