<title id="h-t">Cinderhash — Nazım Çeltekli</title>
<desc id="h-d">Cinderhash: Software · Security · Marketing. Automate your work. Focus on growth. Terminal: whoami → Nazım Çeltekli · Cinderhash; role → Network &amp; Security; focus → TCP/IP, ARP, MITM research, Scapy, Nmap. An animated network of hexagon nodes with packets flowing between them.</desc>
<style>
text{font-kerning:normal}
.sans{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'Geist Mono', SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.fx{transform-box:fill-box;transform-origin:center}
.pk,.ring,.cur,.cover{opacity:0}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes breathe{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes ring{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.85)}}
@keyframes packet{0%{stroke-dashoffset:5}55%,100%{stroke-dashoffset:-100}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{to{transform:translate(48.5px,84px)}}
@keyframes cursor{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){
.enter{animation:enter .7s cubic-bezier(.16,1,.3,1) both}
.float{animation:float 11s ease-in-out infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.drift{animation:drift 36s linear infinite}
.pk{opacity:1;animation:packet 3s linear infinite}
.ring{animation:ring 3.2s ease-out infinite}
.row0{animation:appear .01s linear 0.7s both}
.cov0{opacity:1;animation:type0 0.45s steps(6,end) 1.05s both}
@keyframes type0{from{transform:translateX(0)}to{transform:translateX(54px)}}
.cur0{animation:type0 0.45s steps(6,end) 1.05s both,cursor 1.05s linear 0.7s forwards}
.out0{animation:appear .15s ease-out 1.75s both}
.row1{animation:appear .01s linear 2.1s both}
.cov1{opacity:1;animation:type1 0.6s steps(8,end) 2.45s both}
@keyframes type1{from{transform:translateX(0)}to{transform:translateX(72px)}}
.cur1{animation:type1 0.6s steps(8,end) 2.45s both,cursor 1.2s linear 2.1s forwards}
.out1{animation:appear .15s ease-out 3.3s both}
.row2{animation:appear .01s linear 3.65s both}
.cov2{opacity:1;animation:type2 0.68s steps(9,end) 4s both}
@keyframes type2{from{transform:translateX(0)}to{transform:translateX(81px)}}
.cur2{animation:type2 0.68s steps(9,end) 4s both,cursor 1.27s linear 3.65s forwards}
.out2{animation:appear .15s ease-out 4.93s both}
.last{animation:appear .01s linear 5.28s both}
.blink{animation:blink 1.1s step-end 5.28s infinite}
}
</style>
